name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Chromium for the screenshot test
        run: npx --no-install playwright install --with-deps chromium
      - run: npm run ci
      - name: Package contents
        run: npm pack --dry-run

  scaffold:
    name: create-client-ui builds a working repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Scaffold against this commit's package
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          node "$GITHUB_WORKSPACE/bin/create-client-ui.mjs" acme --name "Acme Life"
          cd acme-ui
          tarball=$(ls "$RUNNER_TEMP"/illustrata-client-sdk-*.tgz)
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("package.json"));p.devDependencies["@illustrata/client-sdk"]="file:"+process.argv[1];fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")' "$tarball"
          npm install --ignore-scripts
          git init -q -b main && git add -A && git -c user.email=ci@illustrata.test -c user.name=ci commit -qm scaffold
      - name: The scaffold's own checks
        working-directory: ${{ runner.temp }}/acme-ui
        run: |
          # The builder takes the commit from GITHUB_SHA in Actions; here that is
          # the SDK's commit, not the scaffold's, so read it from the scaffold's git.
          unset GITHUB_SHA GITHUB_ACTIONS
          npm run ci
          npx --no-install illustrata-check sync --strict
          npx --no-install illustrata-check release
          npx --no-install illustrata-check removal example
