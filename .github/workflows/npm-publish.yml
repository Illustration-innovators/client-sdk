# Publishes @illustrata/client-sdk to npm when a version tag (v1.2.3) is pushed.
#
# Uses npm trusted publishing (OIDC): no npm token is stored. On npmjs.com the
# package's trusted publisher is this repository, workflow file
# `npm-publish.yml`, environment `npm`. Provenance is attached automatically
# because the repository is public. Trusted publishing needs npm >= 11.5.1 and
# Node >= 22.14 on a GitHub-hosted runner.
name: Publish SDK to npm

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run ci
      - name: Tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag $TAG does not match package.json $VERSION"
            exit 1
          fi

  publish:
    name: Publish
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.6.2
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm publish --access public
